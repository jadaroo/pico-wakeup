# Auto-suspend when every login session has been idle for IdleActionSec.
# Desktop idle comes from swayidle (5 min without input); SSH sessions are
# never idle, so the laptop stays awake while you're connected remotely.
#
# Install: sudo install -m 644 host/20-idle-suspend.conf /etc/systemd/logind.conf.d/
#          sudo systemctl kill -s HUP systemd-logind
[Login]
IdleAction=suspend
IdleActionSec=10min
